    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

   * @param {string} property
   */

  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      widgetState: state,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);

      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;

&lt;div id=&quot;advising-aims-map&quot;&gt;
  &lt;h2&gt;What Advising Cultivates&lt;/h2&gt;
  &lt;p class=&quot;text-small&quot;&gt;Tracing advising’s contributions alongside other Gen Ed learning&lt;/p&gt;
  &lt;div class=&quot;am-legend viz-row text-small&quot;&gt;&lt;span class=&quot;am-key&quot;&gt;&lt;/span&gt;Clear textual correspondence &lt;span class=&quot;am-key am-partial&quot;&gt;&lt;/span&gt;Partial / interpretive correspondence&lt;/div&gt;
  &lt;div class=&quot;am-selected&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;details class=&quot;am-inspector&quot;&gt;&lt;summary&gt;Inspect a statement or connection&lt;/summary&gt;&lt;div class=&quot;am-detail&quot;&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;am-map&quot;&gt;
    &lt;svg class=&quot;am-edges&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;section class=&quot;am-left&quot; aria-label=&quot;Through Advising&quot;&gt;&lt;h3&gt;Through Advising&lt;/h3&gt;&lt;div class=&quot;am-advising&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;am-middle&quot; aria-label=&quot;DePauw’s 12 Aims&quot;&gt;&lt;h3&gt;DePauw’s 12 Aims&lt;/h3&gt;&lt;div class=&quot;am-aims&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;am-right&quot; aria-label=&quot;Through Other Gen Ed Outcomes&quot;&gt;&lt;h3&gt;Through &lt;em&gt;Other&lt;/em&gt; Gen Ed Outcomes&lt;/h3&gt;&lt;div class=&quot;am-outcomes&quot;&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;/div&gt;
  &lt;details class=&quot;am-process&quot;&gt;&lt;summary&gt;About this map · AI assistance and interpretive process&lt;/summary&gt;
    &lt;p class=&quot;text-small&quot;&gt;Prepared by Justin Glessner with assistance from OpenAI’s Codex, October 21, 2026. This exploratory map grew from a collaborative reading of advising and curricular source documents. Codex assisted with comparison, proposed connections and explanations, and built the interactive visualization. Justin shaped the questions, reviewed the working analysis, and requested revisions. The visual translation includes interpretive judgments that remain open to review and correction.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;The map asks what advising contributes alongside other Gen Ed learning, where their articulated commitments overlap, and where they differ. It does not assess courses, advisors, programs, or student attainment. Neither side claims to exhaust the curriculum’s educational work. This is a working interpretation for discussion, not an adopted committee position.&lt;/p&gt;
  &lt;/details&gt;
  &lt;details class=&quot;am-register&quot;&gt;&lt;summary&gt;All outcomes and expectations&lt;/summary&gt;&lt;div class=&quot;am-inventory&quot;&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;am-sources&quot;&gt;&lt;summary&gt;Sources and reading the connections&lt;/summary&gt;&lt;div class=&quot;am-source-list&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;DePauw’s twelve aims are faculty-approved institutional aims, not a newly adopted Gen Ed framework. Connections represent interpretive correspondence between texts, not causal effects, attainment, or equivalent educational scope. Clear connections may support only one clause. No recorded connection does not establish absence of learning.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;Advising statements consolidate overlapping source passages; repetition does not generate extra arrows. Source organization identifies the primary display location, while the inspector preserves other supporting passages and years. Later-year guidance is not evidence solely about exploratory advising. Curricular labels and descriptions are condensed for readability; their sources and status are retained. Mission statements, discussion prompts, syllabus outcomes, and draft curricular language are not interchangeable evidence.&lt;/p&gt;
  &lt;/details&gt;
&lt;/div&gt;

const DATA={&quot;title&quot;:&quot;What Advising Cultivates&quot;,&quot;aims&quot;:[{&quot;id&quot;:1,&quot;label&quot;:&quot;Love learning&quot;,&quot;full&quot;:&quot;Love learning and exude a commitment to continued learning throughout their lives.&quot;,&quot;note&quot;:&quot;Curiosity and passion are narrower dispositions than demonstrated lifelong love of learning.&quot;},{&quot;id&quot;:2,&quot;label&quot;:&quot;Methods + interdisciplinary synthesis&quot;,&quot;full&quot;:&quot;Appreciate varied disciplinary and interdisciplinary methods for acquiring knowledge and demonstrate the ability to synthesize knowledge from multiple disciplines.&quot;,&quot;note&quot;:&quot;Connections across experiences are not necessarily synthesis across disciplines.&quot;},{&quot;id&quot;:3,&quot;label&quot;:&quot;Achievements + their limits&quot;,&quot;full&quot;:&quot;Understand and value artistic, cultural, and scientific achievements and the limits of those achievements, past and present.&quot;,&quot;note&quot;:&quot;No defensible advising link recorded. Exploration alone does not establish appraisal of achievements and their limits.&quot;},{&quot;id&quot;:4,&quot;label&quot;:&quot;Cultures, languages + power&quot;,&quot;full&quot;:&quot;Understand and appreciate cultures, languages and groups different than their own and regularly reflect on domestic and global issues of power, privilege and diversity.&quot;,&quot;note&quot;:&quot;Advising explicitly names intercultural perspectives; power and privilege are not explicitly examined in these passages.&quot;},{&quot;id&quot;:5,&quot;label&quot;:&quot;Problems · together + individually&quot;,&quot;full&quot;:&quot;Identify and solve well-defined and ill-defined problems both collaboratively and individually, and apply these skills to problems facing humanity.&quot;,&quot;note&quot;:&quot;Practical planning is not equivalent to the full problem-solving aim.&quot;},{&quot;id&quot;:6,&quot;label&quot;:&quot;Quantitative + qualitative analysis&quot;,&quot;full&quot;:&quot;Demonstrate competency with varied forms of data analysis including organizing, interpreting, and drawing conclusions from quantitative and qualitative information.&quot;,&quot;note&quot;:&quot;No advising link recorded. Gathering information or reading a degree audit is not itself quantitative/qualitative data analysis.&quot;},{&quot;id&quot;:7,&quot;label&quot;:&quot;Technology + society&quot;,&quot;full&quot;:&quot;Demonstrate knowledge of technology and its implications in society and be able to leverage technology, where appropriate, for creative activities or innovative solutions to problems.&quot;,&quot;note&quot;:&quot;Using electronic advising resources is a narrow technological application.&quot;},{&quot;id&quot;:8,&quot;label&quot;:&quot;Independent thought + evidence&quot;,&quot;full&quot;:&quot;Develop capacities for clear, thorough, and independent thought that demonstrates the ability to analyze arguments on the basis of evidence and to understand the value and limitations of multiple types of evidence.&quot;,&quot;note&quot;:&quot;Agency in educational decisions is not the same as evidence-based argument analysis.&quot;},{&quot;id&quot;:9,&quot;label&quot;:&quot;Written + oral expression&quot;,&quot;full&quot;:&quot;Clearly express their ideas and the ideas of others to varied audiences, both in writing and orally.&quot;,&quot;note&quot;:&quot;Self-articulation and advising dialogue do not replace writing or speaking instruction.&quot;},{&quot;id&quot;:10,&quot;label&quot;:&quot;Ethical reflection + acting for good&quot;,&quot;full&quot;:&quot;Engage in serious reflection on the moral and ethical aspects of situations and cultivate a commitment to act in the world for good.&quot;,&quot;note&quot;:&quot;Values and civic participation may support ethical action; they do not establish it.&quot;},{&quot;id&quot;:11,&quot;label&quot;:&quot;Healthy, sustainable + relational living&quot;,&quot;full&quot;:&quot;Embrace healthy and sustainable living through self-reflection and commitment to cultivating positive relationships with others, and both the global and local environment.&quot;,&quot;note&quot;:&quot;The clearest advising link concerns health and self-care. Environmental sustainability remains weakly articulated in this source set.&quot;},{&quot;id&quot;:12,&quot;label&quot;:&quot;Depth + future learning&quot;,&quot;full&quot;:&quot;Attain a deep understanding of a subject area to appreciate the value of depth of knowledge and to serve as a foundation for future learning.&quot;,&quot;note&quot;:&quot;Advising helps organize the pursuit of depth; it does not replace disciplinary learning.&quot;}],&quot;sources&quot;:{&quot;M&quot;:{&quot;name&quot;:&quot;Academic Advising mission&quot;,&quot;status&quot;:&quot;Published institutional mission; not an assessment of achievement&quot;,&quot;url&quot;:&quot;https://www.depauw.edu/academics/academic-resources/advising/&quot;},&quot;G&quot;:{&quot;name&quot;:&quot;Advising Guide&quot;,&quot;status&quot;:&quot;Published developmental guidance and discussion prompts, years one through four&quot;,&quot;url&quot;:&quot;https://www.depauw.edu/academics/academic-resources/advising/advising-guide/&quot;},&quot;S&quot;:{&quot;name&quot;:&quot;Academic Advising Syllabus&quot;,&quot;status&quot;:&quot;Undated DePauw template; current adoption and approval status unconfirmed&quot;,&quot;url&quot;:&quot;https://libguides.depauw.edu/ld.php?content_id=33980788&quot;},&quot;D&quot;:{&quot;name&quot;:&quot;Draft General Education Curriculum Learning Outcomes&quot;,&quot;status&quot;:&quot;Supplied Assessment/Amity working document. Separate Arts and Humanities alternatives used; combined AH alternative excluded.&quot;},&quot;C&quot;:{&quot;name&quot;:&quot;University Catalog 2025–26, p. 15&quot;,&quot;status&quot;:&quot;Published FYS expectations in the supplied catalog; not a separate advising outcome&quot;},&quot;W&quot;:{&quot;name&quot;:&
